<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site B — Delivery Check</title></head>
<body>
<main>
  <h1 data-testid="delivery-title">Delivery Checker</h1>
  <label>PIN code <input data-testid="pin-input" value="500001" /></label>
  <button data-testid="check-button" role="button">Check Delivery</button>
  <div data-testid="delivery-status" aria-live="polite"></div>
</main>
<script>
document.querySelector('[data-testid="check-button"]').addEventListener('click', () => {
  const pin = document.querySelector('[data-testid="pin-input"]').value.trim();
  const el = document.querySelector('[data-testid="delivery-status"]');
  el.textContent = (pin === "500001") ? "Delivery available to PIN 500001 in 2-3 days" : ("Delivery not available to PIN " + pin);
});
</script>
</body>
</html>
