<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoltKart — Product</title>
<style>
  :root { --brand:#1a56db; --bg:#f1f4f9; --card:#fff; --ink:#17233b; --muted:#667085; --line:#e4e9f2; }
  body { margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#1a56db,#0b2f87); color:#fff; padding:14px 28px; font-weight:800; font-size:20px; }
  header a { color:#cfe0ff; font-size:13px; font-weight:400; text-decoration:none; margin-left:16px; }
  main { max-width:720px; margin:28px auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px; display:flex; gap:26px; }
  .thumb { background:linear-gradient(135deg,#dbe7ff,#f3f6ff); border-radius:12px; min-width:220px; display:flex; align-items:center; justify-content:center; font-size:90px; }
  h1 { margin:0 0 6px; font-size:24px; }
  .price { font-size:26px; font-weight:800; color:#1443ad; margin:6px 0; }
  .ram { color:var(--muted); margin:0 0 18px; }
  button { background:var(--brand); color:#fff; border:none; padding:13px 30px; font-size:15px; font-weight:700; border-radius:10px; cursor:pointer; }
</style>
</head>
<body>
<header>VoltKart <a href="/site_a/search.html">← back to search</a></header>
<main>
  <div class="thumb" aria-hidden="true">📱</div>
  <div>
    <h1 data-testid="product-name">Pixel Lite 8GB</h1>
    <p class="price" data-testid="product-price">Rs 18,999</p>
    <p class="ram" data-testid="product-ram">8GB RAM · 128GB storage · 5G</p>
    <button data-testid="enquire-button" role="button">Enquire</button>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search).get("name");
if (q) { const el = document.querySelector('[data-testid="product-name"]'); if (el) el.textContent = decodeURIComponent(q) + " 8GB"; }
</script>
<script src="/chaos.js"></script>
</body>
</html>
