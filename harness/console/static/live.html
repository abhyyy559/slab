<!doctype html>
<html><head><meta charset="utf-8"><title>SENTRY — live metrics</title></head>
<body style="font:18px monospace;background:#000;color:#0f0;padding:24px">
<h2>SENTRY — live metrics</h2>
<pre id="m">waiting for a run... (start one from the dashboard or CLI)</pre>
<script>
setInterval(async () => {
  try {
    const r = await fetch('/api/live');
    const j = await r.json();
    document.getElementById('m').textContent =
      `run: ${j.run_id}\nstep: ${j.step}\nstatus: ${j.status}\ndetect: ${j.detect_ms}ms\nheal: ${j.heal_ms}ms\nextra: ${j.extra_steps}\nelapsed: ${j.elapsed_ms}ms`;
  } catch (e) { document.getElementById('m').textContent = 'console unreachable — is app.py running?'; }
}, 1000);
</script>
</body></html>
